name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: javascript
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: javascript/package-lock.json
      - run: npm ci --ignore-scripts
      - run: node --test ci.test.cjs

  ruby:
    name: Ruby dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUNDLE_FROZEN: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          working-directory: ruby
          bundler-cache: true
      - name: Verify installed dependencies load
        working-directory: ruby
        run: bundle exec ruby -e 'require "business"; require "uk_phone_numbers"; puts "Ruby dependencies loaded"'

  gate:
    name: PR validation
    if: always()
    needs: [javascript, ruby]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          JS_RESULT: ${{ needs.javascript.result }}
          RUBY_RESULT: ${{ needs.ruby.result }}
        run: |
          test "$JS_RESULT" = success
          test "$RUBY_RESULT" = success
